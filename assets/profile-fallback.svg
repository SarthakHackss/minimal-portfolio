<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161618"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3f"/>
      <stop offset="1" stop-color="#1a1a1e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d00" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#ff4d00" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".38" r=".55">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#halo)"/>
  <g>
    <!-- silhouette -->
    <path d="M400 250
             c 92 0 150 74 150 172
             c 0 74 -34 138 -82 166
             c 128 30 232 122 232 262
             l 0 150 -600 0 0 -150
             c 0 -140 104 -232 232 -262
             c -48 -28 -82 -92 -82 -166
             c 0 -98 58 -172 150 -172 z"
          fill="url(#body)"/>
    <!-- rim light -->
    <path d="M400 250 c 92 0 150 74 150 172 c 0 74 -34 138 -82 166"
          fill="none" stroke="url(#rim)" stroke-width="5"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="400" y="898" fill="#55555a" font-size="26" letter-spacing="10">SARTHAK</text>
    <text x="400" y="934" fill="#ff4d00" font-size="17" letter-spacing="6">PORTRAIT SLOT — assets/profile.jpg</text>
  </g>
</svg>
